<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة الإدارة</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⚙️ لوحة إدارة الاختبار</h1>

        <h2>إضافة سؤال</h2>

        <input id="question" placeholder="السؤال">

        <input id="option1" placeholder="الاختيار الأول">

        <input id="option2" placeholder="الاختيار الثاني">

        <input id="option3" placeholder="الاختيار الثالث">

        <input id="option4" placeholder="الاختيار الرابع">

        <select id="correct">

            <option value="0">الإجابة الصحيحة: الاختيار الأول</option>
            <option value="1">الإجابة الصحيحة: الاختيار الثاني</option>
            <option value="2">الإجابة الصحيحة: الاختيار الثالث</option>
            <option value="3">الإجابة الصحيحة: الاختيار الرابع</option>

        </select>

        <button onclick="addQuestion()">
            ➕ إضافة السؤال
        </button>

        <hr>

        <h2>الأسئلة</h2>

        <div id="questions"></div>

        <hr>

        <h2>🏆 ترتيب الطلاب</h2>

        <table>

            <thead>

                <tr>
                    <th>الترتيب</th>
                    <th>الاسم</th>
                    <th>الدرجة</th>
                    <th>الوقت</th>
                </tr>

            </thead>

            <tbody id="results"></tbody>

        </table>

    </div>

    <script src="admin.js"></script>

</body>

</html>
